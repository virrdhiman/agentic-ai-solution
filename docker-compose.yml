version: "3.9"

services:
  # Core agent service
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - AGENT_PROVIDER=${AGENT_PROVIDER:-mock}
      - AI_BASE_URL=${AI_BASE_URL:-http://ollama:11434/v1}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-llama3}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://agent:agent@postgres:5432/autonomous_agent}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - ./agent-work:/app/agent-work
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full
      - core

  # PostgreSQL
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: autonomous_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d autonomous_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - full
      - postgres

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - full
      - redis

  # Ollama (local LLM)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - full
      - opensource

  # n8n (workflow orchestration)
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
    volumes:
      - n8n_data:/home/node/.n8n
    profiles:
      - full
      - n8n

  # API server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn autonomous_agent.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - AGENT_PROVIDER=${AGENT_PROVIDER:-mock}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://agent:agent@postgres:5432/autonomous_agent}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full
      - api

volumes:
  postgres_data:
  ollama_data:
  n8n_data:
